name: LuaLS Composer CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate LuaLS Composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: main
          path: .ci/moonstone
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum file jq libsqlite3-dev lsof pkg-config zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize project
        run: moon sync
      - name: Run test suite
        run: moon run test
      - name: Export release candidate with Ballad
        run: moon run package
      - name: Verify package surface
        run: |
          descriptor=dist/registry/package.toml
          grep -q '^name = "moonstone/luals-composer"$' "$descriptor"
          grep -q '^kind = "lib"$' "$descriptor"
          grep -q '^kind = "source"$' "$descriptor"
          grep -q 'name = "luals_composer.lua"' "$descriptor"
          grep -q 'name = "luals_composer/init.lua"' "$descriptor"

  windows:
    name: Native Windows enrollment and transport
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: 69d2859c80a8b3221e9368d6414ba11fdef486de
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: af29ad4224bcd7ec48c371154fbc3b46fb29a9e5
          path: .ci/ballad
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/alter
          ref: 15db7995ba84a4c33d7f81b782abd0ec151929ed
          path: .ci/alter
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Moonstone
        working-directory: .ci/moonstone
        run: zig build
      - name: Exercise source export and installed transport
        shell: pwsh
        run: |
          $env:MOONSTONE_BIN = "$env:GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin/moon.exe"
          python tests/platform/native_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Composer lifecycle failed' }
